name: CI/CD Pipeline - Quality, Security & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CODE QUALITY, LINTING & AUTOMATED TESTS
  # ==========================================
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-asyncio
        pip install -r requirements.txt

    - name: Run Ruff Linter & Code Style Checks
      run: |
        ruff check .

    - name: Verify Package Dependency Integrity
      run: |
        python -m pip check

    - name: Run Pytest Test Suite
      env:
        GEMINI_API_KEY: "dummy_ci_test_key"
        GEMINI_MODEL: "gemini-3.6-flash"
      run: |
        pytest -v

  # ==========================================
  # 2. DOCKER BUILD VALIDATION
  # ==========================================
  docker-check:
    name: Docker Container Build Verification
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image (Dry Run / Test)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: tamly-chatbot:ci-test
