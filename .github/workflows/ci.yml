name: CI/CD Pipeline - Quality, Security & Docker Build

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CODE QUALITY, LINTING & AUTOMATED TESTS
  # ==========================================
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-asyncio
        pip install -r requirements.txt

    - name: Run Ruff Linter & Code Style Checks
      run: |
        ruff check .

    - name: Verify Package Dependency Integrity
      run: |
        python -m pip check

    - name: Run Pytest Test Suite
      env:
        GEMINI_API_KEY: "dummy_ci_test_key"
        GEMINI_MODEL: "gemini-3.8-flash"
      run: |
        pytest -v

    - name: Start Server Smoke Test
      env:
        GEMINI_API_KEY: "dummy_ci_test_key"
        GEMINI_MODEL: "gemini-3.8-flash"
      run: |
        uvicorn server:app --host 127.0.0.1 --port 8000 &
        server_pid=$!
        trap 'kill "$server_pid"' EXIT
        python - <<'PY'
        import time
        import urllib.request

        for _ in range(30):
            try:
                with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                    assert response.status == 200
                    print("Server smoke test passed")
                    break
            except Exception:
                time.sleep(1)
        else:
            raise SystemExit("Server did not become healthy")
        PY

  # ==========================================
  # 2. DOCKER BUILD VALIDATION
  # ==========================================
  docker-check:
    name: Docker Container Build Verification
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image (Dry Run / Test)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: tamly-chatbot:ci-test

  deploy:
    name: Deploy to Render
    needs: [test, docker-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Render Deployment
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "RENDER_DEPLOY_HOOK_URL is not configured; deployment skipped."
          exit 0
        fi
        curl --fail --show-error --silent --max-time 60 \
          --request POST \
          "$RENDER_DEPLOY_HOOK_URL"
