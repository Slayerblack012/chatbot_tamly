services:
  - type: web
    name: tamly-chatbot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: GEMINI_API_KEY
        sync: false
